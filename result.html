<script>
  // рік в футері
  document.getElementById('year').textContent = new Date().getFullYear();

  const p = new URLSearchParams(location.search);
  const imgUrl = p.get('img') || localStorage.getItem('last_upload_url') || '';
  const orderId = p.get('order') || localStorage.getItem('order_id') || '';
  const uuid = p.get('uuid') || '';
  const previewBox = document.getElementById('preview');

  // показати прев'ю оригіналу (Uploadcare)
  if (!imgUrl) {
    previewBox.innerHTML = '<p class="muted">Фото не додано. <a href="index.html">Повернутися</a></p>';
  } else {
    const thumb = `${imgUrl}-/preview/1200x1200/`;
    previewBox.innerHTML = `<img id="photo" src="${thumb}" alt="preview">`;
  }

  // Полінг готового результату (public/results/<uuid>.json)
  async function pollResult() {
    if (!uuid) return; // нема чого перевіряти
    try {
      const r = await fetch(`/results/${uuid}.json`, { cache: 'no-store' });
      if (r.ok) {
        const j = await r.json();
        if (j && j.ready && j.cdn) {
          // підміняємо прев'ю на фінал
          const finalUrl = `${j.cdn}-/quality/smart/-/format/jpeg/`;
          const imgEl = document.getElementById('photo');
          if (imgEl) imgEl.src = finalUrl;
          else previewBox.innerHTML = `<img id="photo" src="${finalUrl}" alt="result">`;
          return; // зупиняємо полінг
        }
      }
    } catch (e) {
      // тихо ідемо далі
    }
    setTimeout(pollResult, 2500);
  }
  pollResult();

  // (опціонально) скачати оригінал
  function triggerDownload(url, fileName = 'photo.jpg') {
    const a = document.createElement('a');
    a.href = `${url}-/inline/no/${encodeURIComponent(fileName)}`;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  window._downloadOriginal = () => { if (imgUrl) triggerDownload(imgUrl, `${orderId || 'order'}-original.jpg`); };
</script>
