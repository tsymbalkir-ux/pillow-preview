<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Результат — Подушка з фото</title>
  <meta name="description" content="Готовий макет подушки з вашого фото."/>
  <style>
    :root{--bg:#f7fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    header{text-align:center;margin-bottom:12px}
    header h1{margin:6px 0 4px}
    header p{margin:0;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
    .preview{display:flex;align-items:center;justify-content:center;min-height:320px;border:1px dashed var(--line);border-radius:14px;background:#fff}
    .preview img{max-width:100%;max-height:520px;display:block;border-radius:12px}
    .status{color:var(--muted);font-size:14px;margin-top:8px}
    .btn{display:inline-block;border:1px solid var(--accent);color:#fff;background:var(--accent);border-radius:12px;padding:10px 14px;text-decoration:none;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--accent)}
    .links{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
    iframe{width:100%;height:520px;border:0;border-radius:12px;background:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Результат</h1>
      <p>Показуємо макет, щойно він з’явиться у вихідній папці.</p>
    </header>

    <section class="card">
      <div class="preview" id="box"><div class="status" id="msg">Очікуємо на макет…</div></div>
      <div class="status" id="st">Обробляємо… (оновлення кожні 4 с)</div>
      <div class="links">
        <a class="btn ghost" href="index.html">← На головну</a>
        <button class="btn ghost" id="retry" type="button">Оновити статус</button>
        <a class="btn ghost" id="openDrive" href="#" target="_blank" rel="noopener" style="display:none">Відкрити у Google Drive</a>
        <a class="btn ghost" id="download" href="#" download style="display:none">Завантажити файл</a>
      </div>
    </section>
  </div>

  <script>
    // ПІДСТАВ СВІЖИЙ /exec (той що працює з ?action=ping)
    const STATUS_URL = 'https://script.google.com/macros/s/AKfycbw8unVmOHlb35-PhgpefbU32bYgh693Cdm7PDYOmTJwdx4Zc53eVeXbupXGprph_Rrt/exec';

    const box   = document.getElementById('box');
    const st    = document.getElementById('st');
    const retry = document.getElementById('retry');
    const aDrive= document.getElementById('openDrive');
    const aDown = document.getElementById('download');

    const qs  = new URLSearchParams(location.search);
    const job = (qs.get('job') || localStorage.getItem('last_job_id') || '').trim();

    const setStatus = (t)=> st && (st.textContent = t);
    const antiCache = (u)=> u + (u.includes('?')?'&':'?') + 'nocache=' + Date.now();

    function showError(t){
      box.innerHTML = `<div style="color:#d11;padding:10px 0">${t}</div>`;
      setStatus('');
    }
    function canLoadImg(u){
      return new Promise(res=>{
        const i = new Image();
        i.onload  = ()=>res(true);
        i.onerror = ()=>res(false);
        i.src = antiCache(u);
      });
    }
    function renderImg(u, viewUrl, downloadUrl){
      box.innerHTML = `<img src="${antiCache(u)}" alt="Готовий макет">`;
      setStatus('✅ Макет готовий!');
      if (viewUrl){ aDrive.href=viewUrl; aDrive.style.display='inline-block'; }
      if (downloadUrl){ aDown.href=downloadUrl; aDown.style.display='inline-block'; }
      localStorage.setItem('result_url', u);
    }
    function renderIframe(viewUrl, downloadUrl){
      box.innerHTML = `<iframe src="${viewUrl}"></iframe>
        <div style="margin-top:8px">
          <a href="${viewUrl}" target="_blank" rel="noopener">Відкрити у Drive</a>
          ${downloadUrl ? ' | <a href="'+downloadUrl+'">Завантажити</a>' : ''}
        </div>`;
      setStatus('✅ Макет готовий (через превʼю Drive)');
    }

    async function askStatus(){
      const r = await fetch(`${STATUS_URL}?action=status&job_id=${encodeURIComponent(job)}&ts=${Date.now()}`, { cache:'no-store' });
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.json(); // {ok, ready, id, url, downloadUrl, viewUrl, ...}
    }

    async function run(timeoutMs=5*60*1000, stepMs=4000){
      if (!job){ showError('Не передано job_id. Поверніться на головну і завантажте фото.'); return; }

      // спроба з кешу
      const cached = localStorage.getItem('result_url');
      if (cached && await canLoadImg(cached)) { renderImg(cached, null, null); return; }

      const start = Date.now();
      while (Date.now() - start < timeoutMs){
        try{
          const s = await askStatus();
          console.log('[status]', s);
          if (s.ok && s.ready){
            // 1) прямий контент-url
            if (s.url && await canLoadImg(s.url)) { renderImg(s.url, s.viewUrl, s.downloadUrl); return; }
            // 2) завантажувальний url
            if (s.downloadUrl && await canLoadImg(s.downloadUrl)) { renderImg(s.downloadUrl, s.viewUrl, s.downloadUrl); return; }
            // 3) fallback — Drive-превʼю
            if (s.viewUrl) { renderIframe(s.viewUrl, s.downloadUrl); return; }

            showError('Файл знайдено, але не вдалось показати превʼю.');
            return;
          }
          setStatus('Обробляємо… (оновлення кожні 4 с)');
        }catch(e){
          setStatus('Очікуємо зʼєднання…');
        }
        await new Promise(r=>setTimeout(r, stepMs));
      }
      showError('Поки що немає готового макету. Оновіть сторінку трохи пізніше.');
    }

    retry && retry.addEventListener('click', ()=>{ setStatus('Перевіряємо…'); run(60*1000, 2000); });
    run();
  </script>
</body>
</html>
