<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Подушка з фото — Завантажити</title>
  <meta name="description" content="Завантаж своє фото — отримаєш попередній перегляд і результат." />
  <!-- Uploadcare -->
  <script>
    window.UPLOADCARE_PUBLIC_KEY = 'a531fc572a02653c4d18';
    window.UPLOADCARE_STORE = 'auto';        // одразу дає cdnUrl
    window.UPLOADCARE_SYSTEM_DIALOG = true;  // відкривати системний вибір файлів
  </script>
  <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;display:grid;place-items:center;min-height:100dvh;background:#f7fafc}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(2,6,23,.06);max-width:520px;width:100%}
    h1{margin:0 0 8px}
    p{margin:0 0 16px;color:#64748b}
    .btn{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:10px;background:#0ea5e9;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <h1>Завантаж своє фото</h1>
    <p>Після завантаження ми автоматично відкриємо сторінку попереднього перегляду.</p>

    <!-- Uploader -->
    <input type="hidden" role="uploadcare-uploader" id="uploader"
           data-clearable="true" data-images-only="true" />

    <a class="btn" id="open">Обрати файл</a>
    <div id="status" style="margin-top:10px;color:#94a3b8;font-size:14px;"></div>
  </div>

  <script>
    const w = uploadcare.Widget('#uploader');
    document.getElementById('open').addEventListener('click', () => w.openDialog());

    const $status = document.getElementById('status');

    // Показуємо прогрес (необов'язково)
    w.onUploadProgress((info) => {
      if (!info) return;
      $status.textContent = `Завантаження: ${Math.round(info.progress*100)}%`;
    });

    // Коли файл збережено — редіректимо на result.html
    w.onUploadComplete(async (info) => {
      // info містить uuid, cdnUrl, originalFilename
      const uuid = info.uuid;
      // інколи cdnUrl з’являється не одразу → підстрахуємося
      let cdn = info.cdnUrl;
      if (!cdn && info.cdnUrlModifiers !== undefined && info.isStored) {
        // останні версії завжди дають cdnUrl при store=auto, але хай буде
        cdn = `https://ucarecdn.com/${uuid}/`;
      }
      // збережемо в localStorage для сумісності з твоєю result-сторінкою
      if (cdn) localStorage.setItem('last_upload_url', cdn);

      // опціонально свій order_id
      const orderId = Date.now().toString();
      localStorage.setItem('order_id', orderId);

      // редірект з параметрами (uuid + img + name)
      const name = encodeURIComponent(info.originalFilename || '');
      const imgQ = cdn ? `&img=${encodeURIComponent(cdn)}` : '';
      location.href = `/result.html?uuid=${uuid}${imgQ}&name=${name}&order=${orderId}`;
    });
  </script>
</body>
</html>
