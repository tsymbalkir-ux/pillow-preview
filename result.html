<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Попередній перегляд — Подушка з фото</title>
  <meta name="description" content="Попередній перегляд вашої подушки та оформлення замовлення."/>
  <style>
    :root{
      --bg:#f7fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
      --accent:#0ea5e9; --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    header{text-align:center;margin-bottom:16px}
    header h1{font-size:clamp(22px,4.6vw,34px);margin:0 0 8px}
    header p{margin:0 auto;color:var(--muted);max-width:640px;font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px rgba(2,6,23,.04);margin-bottom:18px}
    .preview img{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 16px 36px rgba(2,6,23,.06)}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .btn.ghost{background:#edf2f7;color:#0f172a;border:1px solid #dbe3ee}
    .muted{color:var(--muted);font-size:14px}
    footer{margin:28px 0 16px;color:#94a3b8;font-size:13px;text-align:center}
    .hint{font-size:13px;color:#909db1;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Попередній перегляд</h1>
      <p>Спочатку бачиш прев’ю завантаженого фото. Коли макет буде готовий — картинка оновиться автоматично.</p>
    </header>

    <section class="card">
      <div id="preview" class="preview"></div>
      <div id="note" class="hint"></div>
      <a href="index.html" class="btn ghost" style="margin-top:12px;display:inline-block">↩️ Завантажити інше фото</a>
    </section>

    <footer>© <span id="year"></span> Подушка з фото</footer>
  </div>

 <script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const params  = new URLSearchParams(location.search);
  const imgUrl  = params.get('img')  || localStorage.getItem('last_upload_url') || '';
  const uuid    = params.get('uuid') || localStorage.getItem('last_uuid') || '';
  const box     = document.getElementById('preview');
  const note    = document.getElementById('note');

  // JSONBin (public read)
  const BIN_ID  = "690a58f0d0ea881f40d3da19";
  const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

  // Визначимо "базовий" CDN-хост із параметра img (щоб поважати *.ucarecd.net)
  function pickCdnBase() {
    try {
      const u = new URL(imgUrl);
      return `${u.protocol}//${u.host}`; // напр., https://5qcw92vr76.ucarecd.net
    } catch { 
      return "https://5qcw92vr76.ucarecd.net"; 
    }
  }

  function extractUuidFrom(any) {
    // витягаємо UUID із рядка типу "https://.../<uuid>/" або просто "<uuid>"
    const m = String(any).match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    return m ? m[0] : "";
  }

  // 1) показуємо превʼю
  if (imgUrl) {
    const thumb = `${imgUrl.replace(/\/$/, "")}/-/preview/1200x1200/`;
    box.innerHTML = `<img id="photo" src="${thumb}" alt="preview">`;
    note.textContent = uuid
      ? 'Очікуємо готовий макет… Сторінка оновиться автоматично.'
      : 'UUID не передано. Показуємо лише прев’ю.';
  } else {
    box.innerHTML = '<p class="muted">Фото не додано. <a href="index.html">Повернутися</a></p>';
    note.textContent = '';
  }

  // 2) полінг JSONBin за uuid → будуємо фінальний URL на базі того ж хоста, що в img
  async function poll() {
    if (!uuid) return;
    try {
      const r = await fetch(`${BIN_URL}?ts=${Date.now()}`, { cache: 'no-store' });
      if (r.ok) {
        const j = await r.json();
        const record = j.record || {};
        // у JSONBin значенням зберігаємо ТІЛЬКИ result_uuid або старий повний URL — підтримуємо обидва
        const saved = record[uuid];
        const resultUuid = extractUuidFrom(saved);
        if (resultUuid) {
          const base = pickCdnBase(); // поважає *.ucarecd.net
          const finalUrl = `${base}/${resultUuid}/-/quality/smart/-/format/jpeg/`;
          const imgEl = document.getElementById('photo');
          if (imgEl) imgEl.src = finalUrl; else box.innerHTML = `<img id="photo" src="${finalUrl}" alt="result">`;
          note.textContent = 'Готово ✅';
          return; // stop polling
        }
      }
    } catch {}
    setTimeout(poll, 2500);
  }
  poll();
</script>

</body>
</html>
