<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Результат — Подушка з фото</title>
  <meta name="description" content="Готовий макет подушки з вашого фото."/>
  <style>
    :root{--bg:#f7fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    header{text-align:center;margin-bottom:16px}
    header h1{font-size:clamp(22px,4.6vw,34px);margin:0 0 8px}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
      box-shadow:0 10px 30px rgba(2,6,23,.04);margin-bottom:18px
    }
    .preview{min-height:200px;display:flex;align-items:center;justify-content:center}
    .preview img{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 16px 36px rgba(2,6,23,.06)}
    .muted{color:var(--muted);font-size:14px;text-align:center;margin-top:8px}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .btn.ghost{background:#edf2f7;color:#0f172a;border:1px solid #dbe3ee}

    /* NEW: стилі для селектора розміру */
    .controls{margin-top:14px;display:flex;justify-content:center}
    .form-row{display:flex;flex-direction:column;gap:6px;max-width:360px;width:100%}
    label{font-size:14px;color:var(--muted)}
    select{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
      background:#fff;font-size:14px;color:#0f172a;outline:none
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Готовий результат</h1>
      <p id="status" class="muted">Очікуємо на макет…</p>
    </header>

    <section class="card">
      <div id="preview" class="preview"></div>

      <div style="text-align:center;margin-top:12px">
        <a href="index.html" class="btn ghost">↩️ Завантажити інше фото</a>
      </div>

      <!-- NEW: випадаючий список "Оберіть розмір" -->
      <div class="controls">
        <div class="form-row">
          <label for="sizeSelect">Оберіть розмір</label>
          <select id="sizeSelect" name="size">
            <option value="33x100|950">33 на 100 см — 950 грн</option>
            <option value="40x120|1190">40 на 120 см — 1190 грн</option>
            <option value="50x150|1490">50 на 150 см — 1490 грн</option>
            <option value="60x180|1890">60 на 180 см — 1890 грн</option>
          </select>
        </div>
      </div>
    </section>
  </div>

  <script>
    const CDN_HOST = "https://5qcw92vr76.ucarecd.net";
    const BIN_ID  = "690cba9443b1c97be99cf32e";
    const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
    const POLL_MS = 900; // швидше за 2500

    const qs      = new URLSearchParams(location.search);
    const origId  = qs.get("uuid") || localStorage.getItem("last_uuid") || "";
    const box     = document.getElementById("preview");
    const status  = document.getElementById("status");

    function pickUuid(s){
      const m = String(s||"").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      return m ? m[0] : "";
    }

    if (!origId) {
      status.textContent = "Не передано uuid (ключ замовлення). Поверніться та завантажте фото ще раз.";
    } else {
      localStorage.setItem("last_uuid", origId);
      poll();
    }

    async function poll(){
      try {
        const ctrl = new AbortController();
        const id = setTimeout(()=>ctrl.abort(), 2000); // таймаут на довгі відповіді
        const r = await fetch(`${BIN_URL}?ts=${Date.now()}`, { cache: "no-store", signal: ctrl.signal });
        clearTimeout(id);
        if (r.ok) {
          const j = await r.json();
          const resUuid = pickUuid((j.record || {})[origId]);
          if (resUuid) {
            const url = `${CDN_HOST}/${resUuid}/-/preview/1000x1000/`;
            box.innerHTML = `<img src="${url}" alt="result">`;
            status.textContent = "✅ Макет готовий!";
            return;
          }
        }
      } catch (_) { /* тихо */ }
      setTimeout(poll, POLL_MS);
    }
  </script>
</body>
</html>
