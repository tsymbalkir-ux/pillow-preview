<script>
  /* ======= CONFIG ======= */
  // JSONBin з мапою: { "<input_uuid>": "<result_uuid>" }
  const BIN_ID     = "6914cead43b1c97be9a96b03";
  // Твій Uploadcare CDN-домен:
  const CDN_HOST   = "mt7stlfqcv.ucarecd.net";
  // Розмір прев’ю для відображення:
  const PREVIEW_SZ = "1000x1000";

  // Якщо користуєшся Google Sheets для замовлень — залиш ORDER_URL
  const ORDER_URL  = 'https://script.google.com/macros/s/___YOUR_ORDER_WEB_APP___/exec';

  /* ======= Елементи ======= */
  const box    = document.getElementById('preview');
  const status = document.getElementById('status');

  /* ======= UUID, що шукаємо ======= */
  const qs         = new URLSearchParams(location.search);
  const inputUuid  = (qs.get('uuid') || localStorage.getItem('last_uuid') || '').trim();

  function previewUrl(resUuid){
    return `https://${CDN_HOST}/${resUuid}/-/preview/${PREVIEW_SZ}/`;
  }
  function fullPngUrl(resUuid){
    return `https://${CDN_HOST}/${resUuid}/-/format/png/`;
  }
  function setPreview(url){
    box.innerHTML = `<img src="${url}" alt="Готовий макет">`;
    localStorage.setItem('result_url', url);
    status.textContent = '✅ Макет готовий!';
  }

  async function fetchMap(){
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { cache:'no-store' });
    if (!r.ok) throw new Error('jsonbin http ' + r.status);
    const j = await r.json();
    return j.record || {};
  }

  async function loadResult(){
    if (!inputUuid){
      status.textContent = 'Не передано uuid. Поверніться на головну та завантажте фото ще раз.';
      return;
    }

    // миттєвий показ із кешу (якщо є)
    const cachedUrl  = localStorage.getItem('result_url');
    const cachedUuid = localStorage.getItem('last_uuid');
    if (cachedUrl && cachedUuid === inputUuid){
      setPreview(cachedUrl);
      return;
    }

    status.textContent = 'Очікуємо на макет…';
    const timeoutMs  = 3 * 60 * 1000; // 3 хвилини очікування
    const intervalMs = 4000;
    const t0 = Date.now();

    while (Date.now() - t0 < timeoutMs){
      try{
        const map = await fetchMap();
        const resUuid = map[inputUuid];
        if (resUuid){
          const prev = previewUrl(resUuid);
          const full = fullPngUrl(resUuid);
          setPreview(prev);
          // запам’ятати посилання
          try {
            localStorage.setItem('last_uuid', inputUuid);
            localStorage.setItem('result_url', full);
          } catch(e){}
          return;
        }
      }catch(e){
        // тихо ідемо далі
        console.warn('status error:', e);
      }
      status.textContent = 'Обробляємо…';
      await new Promise(r => setTimeout(r, intervalMs));
    }
    status.textContent = 'Поки що немає готового макету. Оновіть сторінку трохи пізніше.';
  }

  loadResult();

  /* ======= Надсилання форми у Google Sheets (без змін у верстці) ======= */
  const formEl = document.getElementById('orderForm');
  const msgEl  = document.getElementById('formMsg');
  const sizeEl = document.getElementById('sizeSelect');

  formEl.addEventListener('submit', async (e)=>{
    e.preventDefault();
    msgEl.textContent = 'Надсилаємо…';

    const [size, price] = String(sizeEl.value||'').split('|');

    const payload = {
      order_id:   localStorage.getItem('order_id') || '',
      uuid:       inputUuid,
      input_url:  localStorage.getItem('input_url') || '',
      result_url: localStorage.getItem('result_url') || '',
      size_label: sizeEl.options[sizeEl.selectedIndex].text,
      size_value: size,
      price_uah:  price,
      phone:      document.getElementById('phone').value.trim(),
      last_name:  document.getElementById('lname').value.trim(),
      first_name: document.getElementById('fname').value.trim(),
      city:       document.getElementById('city').value.trim(),
      np_branch:  document.getElementById('np').value.trim(),
      comment:    document.getElementById('comment').value.trim(),
      source:     'pillow-preview',
      ts:         new Date().toISOString()
    };

    try{
      await fetch(ORDER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        mode: 'no-cors'
      });
      msgEl.textContent = '✅ Заявку надіслано! Ми зв’яжемося з вами.';
      formEl.reset();
    }catch(err){
      console.error('send error', err);
      msgEl.textContent = '❌ Не вдалося надіслати. Спробуйте ще раз.';
    }
  });
</script>
