<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Результат — Подушка з фото</title>
  <meta name="description" content="Готовий макет подушки з вашого фото."/>
  <style>
    :root{--bg:#f7fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    header{text-align:center;margin-bottom:12px}
    header h1{margin:6px 0 4px}
    header p{margin:0;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
    .preview{display:flex;align-items:center;justify-content:center;min-height:320px;border:1px dashed var(--line);border-radius:14px;background:#fff}
    .preview img{max-width:100%;max-height:520px;display:block;border-radius:12px}
    .status{color:var(--muted);font-size:14px;margin-top:8px}
    .btn{display:inline-block;border:1px solid var(--accent);color:#fff;background:var(--accent);border-radius:12px;padding:10px 14px;text-decoration:none;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--accent)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Результат</h1>
      <p>Показуємо макет, щойно він з’явиться у вихідній папці.</p>
    </header>

    <section class="card">
      <div class="preview" id="box"><div class="status" id="msg">Очікуємо на макет…</div></div>
      <div class="status" id="st">Перевіряємо кожні 4 секунди.</div>
      <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn ghost" href="index.html">← На головну</a>
        <button class="btn ghost" id="retry" type="button">Оновити статус</button>
      </div>
    </section>
  </div>

  <script>
    // ПІДСТАВ СВІЙ /exec (той, що працює на ?action=ping)
    const STATUS_URL = 'https://script.google.com/macros/s/AKfycbwoaloaA4RlAPqjDh4Om-3iWK0sO-BCQS25D1SRB3uWspueE_QLAlB4NTcazJPD4GBl/exec';

    const box   = document.getElementById('box');
    const st    = document.getElementById('st');
    const msgEl = document.getElementById('msg');
    const retry = document.getElementById('retry');

    // job_id із ?job=... або з localStorage
    const qs  = new URLSearchParams(location.search);
    const job = (qs.get('job') || localStorage.getItem('last_job_id') || '').trim();

    function setStatus(text){ if (st) st.textContent = text; }
    function showError(text){
      setStatus(''); 
      if (box) box.innerHTML = `<div style="color:#d11;padding:8px 0">${text}</div>`;
    }
    function showImage(url){
      const u = url + (url.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
      box.innerHTML = `<img src="${u}" alt="Готовий макет">`;
      setStatus('✅ Макет готовий!');
      localStorage.setItem('result_url', url);
    }

    async function askStatus(){
      if (!job){
        showError('Не передано job_id. Поверніться на головну і завантажте фото.');
        throw new Error('no job');
      }
      const url = `${STATUS_URL}?action=status&job_id=${encodeURIComponent(job)}&ts=${Date.now()}`;
      const r = await fetch(url, { cache:'no-store' });
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.json(); // {ok, ready, url?}
    }

    async function pollLoop(maxMs = 5*60*1000, stepMs = 4000){
      // Показати з кешу, якщо вже дивились
      const cached = localStorage.getItem('result_url');
      if (cached) showImage(cached);

      const start = Date.now();
      while (Date.now() - start < maxMs){
        try{
          const s = await askStatus();
          if (s && s.ok && s.ready && s.url){
            showImage(s.url);
            return true;
          }
          setStatus('Обробляємо… (оновлення кожні 4 сек)');
        }catch(e){
          setStatus('Очікуємо з’єднання…');
        }
        await new Promise(r=>setTimeout(r, stepMs));
      }
      showError('Поки що немає готового макету. Оновіть сторінку трохи пізніше.');
      return false;
    }

    retry.addEventListener('click', ()=> {
      setStatus('Перевіряємо…');
      pollLoop(60*1000, 2000); // короткий цикл на 60с
    });

    // старт
    pollLoop();
  </script>
</body>
</html>
