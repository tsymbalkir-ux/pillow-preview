<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Результат — Подушка з фото</title>
  <meta name="description" content="Готовий макет подушки з вашого фото."/>
  <style>
    :root{--bg:#f7fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    header{text-align:center;margin-bottom:12px}
    header h1{margin:6px 0 4px}
    header p{margin:0;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
    .preview{display:flex;align-items:center;justify-content:center;min-height:320px;border:1px dashed var(--line);border-radius:14px;background:#fff}
    .preview img{max-width:100%;max-height:520px;display:block;border-radius:12px}
    .status{color:var(--muted);font-size:14px;margin-top:8px}
    .btn{display:inline-block;border:1px solid var(--accent);color:#fff;background:var(--accent);border-radius:12px;padding:10px 14px;text-decoration:none;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--accent)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Результат</h1>
      <p>Показуємо макет, щойно він з’явиться у вихідній папці.</p>
    </header>

    <section class="card">
      <div class="preview" id="box"><div class="status">Очікуємо на макет…</div></div>
      <div class="status" id="st">Перевіряємо кожні 4 секунди.</div>
      <div style="margin-top:10px">
        <a class="btn ghost" href="index.html">← На головну</a>
      </div>
    </section>
  </div>

  <script>
    const STATUS_URL = 'YOUR_GAS_WEB_APP_EXEC_URL'; // <-- той самий /exec

    const box = document.getElementById('box');
    const st  = document.getElementById('st');

    const qs = new URLSearchParams(location.search);
    const job = (qs.get('job') || localStorage.getItem('last_job_id') || '').trim();

    function show(url){
      box.innerHTML = `<img src="${url}" alt="Готовий макет">`;
      st.textContent = '✅ Макет готовий!';
      localStorage.setItem('result_url', url);
    }

    async function ask(){
      if (!job){
        st.textContent = 'job_id не передано. Поверніться на головну.';
        return { ok:false };
      }
      const url = `${STATUS_URL}?action=status&job_id=${encodeURIComponent(job)}&ts=${Date.now()}`;
      const r = await fetch(url, { cache:'no-store' });
      if (!r.ok) return { ok:false };
      return r.json(); // {ok, ready, url?}
    }

    async function poll(){
      // миттєво з кешу
      const u = localStorage.getItem('result_url');
      if (u) { show(u); return; }

      const start = Date.now(), timeoutMs=5*60*1000, intervalMs=4000;
      while (Date.now()-start < timeoutMs){
        try{
          const s = await ask();
          if (s.ok && s.ready && s.url){ show(s.url); return; }
        }catch(e){}
        st.textContent = 'Обробляємо…';
        await new Promise(r=>setTimeout(r, intervalMs));
      }
      st.textContent = 'Поки що немає готового макету. Оновіть сторінку трохи пізніше.';
    }
    poll();
  </script>
</body>
</html>
