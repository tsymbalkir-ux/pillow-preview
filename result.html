<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Результат — Подушка з фото</title>
  <meta name="description" content="Готовий макет подушки з вашого фото."/>
  <style>
    :root{--bg:#f7fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    header{text-align:center;margin-bottom:16px}
    header h1{font-size:clamp(22px,4.6vw,34px);margin:0 0 8px}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
      box-shadow:0 10px 30px rgba(2,6,23,.04);margin-bottom:18px
    }
    .preview{min-height:200px;display:flex;align-items:center;justify-content:center}
    .preview img{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 16px 36px rgba(2,6,23,.06)}
    .muted{color:var(--muted);font-size:14px;text-align:center;margin-top:8px}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .btn.ghost{background:#edf2f7;color:#0f172a;border:1px solid #dbe3ee}
    .btn.primary{background:linear-gradient(135deg,var(--accent),#60a5fa);color:#fff}
    .note{font-size:12px;color:var(--muted)}
    .success{color:#16a34a}
    .error{color:#dc2626}

    /* селектор розміру */
    .controls{
      margin-top:14px;
      display:flex;
      justify-content:center;
    }
    .form-row{
      display:flex;
      flex-direction:column;
      gap:6px;
      max-width:500px;      /* стало ширше */
      width:100%;
    }
    label{
      font-size:15px;
      color:var(--muted);
      text-align:center;
    }
    select{
      width:100%;
      padding:16px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      font-size:16px;
      color:#0f172a;
      outline:none;
      font-weight:500;
      box-shadow:0 6px 14px rgba(2,6,23,.05);
    }

    /* інфо-блок */
    .info-block{
      margin-top:20px;
      padding:14px 18px;
      background:#f1f5f9;
      border-radius:12px;
      font-size:14px;
      line-height:1.6;
      color:#0f172a;
    }
    .info-block ul{padding-left:18px;margin:0}

    /* замовлення */
    .order{margin-top:18px}
    .order h3{margin:0 0 10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid .full{grid-column:1/-1}
    .submit-row{
      margin-top:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
    }

    /* відгуки */
    .reviews {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(2,6,23,.04);
      margin-bottom: 18px;
      padding: 16px 18px;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }
    .carousel { position: relative; overflow: hidden; }
    .carousel-track {
      display: flex; gap: 12px; overflow-x: auto;
      scroll-behavior: smooth; scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar {display: none;}
    .review img{
      height: 140px; border-radius: 10px; border: 1px solid var(--line);
      box-shadow: 0 6px 14px rgba(2,6,23,.05);
    }
    .nav{
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.9); border: 1px solid #ccc;
      border-radius: 50%; width: 34px; height: 34px; font-size: 22px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow: 0 3px 10px rgba(0,0,0,.1);
    }
    .nav.prev{left:4px} .nav.next{right:4px}
    @media(max-width:600px){ .review img{height:120px} .nav{display:none} }

    /* FAQ */
    .faq{
      max-width:760px;
      margin-left:auto;margin-right:auto;
    }
    .faq details{padding:10px 2px;border-top:1px solid var(--line)}
    .faq details:first-of-type{border-top:none}
    .faq summary{cursor:pointer;list-style:none;font-weight:600;color:var(--text)}
    .faq summary::-webkit-details-marker{display:none}
    .faq details>div{margin-top:6px;color:var(--muted);line-height:1.6;font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Готовий результат</h1>
      <p id="status" class="muted">Очікуємо на макет…</p>
    </header>

    <section class="card">
      <div id="preview" class="preview"></div>

      <div style="text-align:center;margin-top:12px">
        <a href="index.html" class="btn ghost">↩️ Завантажити інше фото</a>
      </div>

      <!-- Інфо-блок -->
      <div class="info-block">
        <ul>
          <li><strong>Без Передоплат</strong></li>
          <li>Виготовлення і відправка <strong>Новою Поштою 1–2 робочих дні</strong></li>
          <li>Матеріал наволочки — <strong>габардин</strong>, подушка — <strong>бязь</strong>, наповнювач — <strong>холофайбер</strong></li>
        </ul>
      </div>

      <!-- Випадаючий список "Оберіть розмір" (тепер нижче) -->
      <div class="controls large-select">
        <div class="form-row">
          <label for="sizeSelect">Оберіть розмір</label>
          <select id="sizeSelect" name="size">
            <option value="33x100|950">33 на 100 см — 950 грн</option>
            <option value="40x120|1190">40 на 120 см — 1190 грн</option>
            <option value="50x150|1490">50 на 150 см — 1490 грн</option>
            <option value="60x180|1890">60 на 180 см — 1890 грн</option>
          </select>
        </div>
      </div>
    </section>
