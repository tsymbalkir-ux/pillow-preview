<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Подушка з фото — Завантаження</title>
  <style>
    :root{--bg:#fff;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px;}
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    header{text-align:center;margin-bottom:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
    .btn{display:inline-block;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
    .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    #preview img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
    #goResultWrap{display:none;margin-top:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Подушка з фото</h1>
      <p class="muted">Завантажте зображення — ми підготуємо макет.</p>
    </header>

    <div class="card">
      <div class="row">
        <button id="pick" class="btn btn-primary">Обрати фото</button>
        <input id="file" type="file" accept="image/*" style="display:none" />
        <span id="status"></span>
      </div>
      <div id="preview" style="margin-top:12px;"></div>
      <div id="goResultWrap">
        <a id="goResult" class="btn" href="#">Перейти до результату</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw8unVmOHlb35-PhgpefbU32bYgh693Cdm7PDYOmTJwdx4Zc53eVeXbupXGprph_Rrt/exec';

      const pickBtn  = document.getElementById('pick');
      const fileIn   = document.getElementById('file');
      const statusEl = document.getElementById('status');
      const preview  = document.getElementById('preview');
      const goWrap   = document.getElementById('goResultWrap');
      const goLink   = document.getElementById('goResult');

      if (!pickBtn || !fileIn || !statusEl || !preview || !goWrap || !goLink) {
        console.error('Не знайдені потрібні елементи на сторінці.');
        return;
      }

      pickBtn.addEventListener('click', () => fileIn.click());

      async function fileToPngDataUrl(file){
        const img = document.createElement('img');
        img.decoding = 'async';
        img.src = URL.createObjectURL(file);
        await new Promise((res, rej)=>{ img.onload = res; img.onerror = rej; });
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(img.src);
        return canvas.toDataURL('image/png'); // PNG для Photoshop
      }

      fileIn.addEventListener('change', async () => {
        const f = fileIn.files && fileIn.files[0];
        if (!f) return;

        // прев’ю
        const localUrl = URL.createObjectURL(f);
        preview.innerHTML = `<img src="${localUrl}" alt="Ваше фото">`;

        statusEl.textContent = 'Готуємо PNG і завантажуємо у чергу…';
        try {
          // якщо боїмося ОЗП у GAS — краще відправляти cdnUrl; тут лишаю PNG-dataURL як швидку перевірку
          const dataUrlPng = await fileToPngDataUrl(f);

          const resp = await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: {'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify({
              filename: (f.name.replace(/\.[^.]+$/,'') || 'input') + '.png',
              mime: 'image/png',
              dataUrl: dataUrlPng
              // АБО краще cdnUrl з форсом PNG: { cdnUrl: 'https://.../-/format/png/' }
            })
          });
          const j = await resp.json();
          if (!j.ok) throw new Error(j.error || 'Помилка завантаження');
          const jobId = j.job_id;

          statusEl.textContent = 'Фото у черзі. Йдемо на сторінку результату…';
          goLink.href = `result.html?job=${encodeURIComponent(jobId)}`;
          goWrap.style.display = 'block';
        } catch (err) {
          console.error(err);
          statusEl.textContent = '❌ Не вдалося завантажити. Перевірте URL бекенду.';
        }
      });
    });
  </script>
</body>
</html>
