<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Подушка з фото — Завантаж своє зображення</title>
  <meta name="description" content="Створи унікальний подарунок: подушка з твоїм фото. Завантаж зображення з телефону або комп'ютера — ми обробимо та надішлемо результат." />

  <!-- Uploadcare config -->
  <script>
    window.UPLOADCARE_PUBLIC_KEY = 'a531fc572a02653c4d18';
    /* Перший аплоад UNSTORED, щоб другим зберегти як input-<id>.png */
    window.UPLOADCARE_STORE = '0';
    window.UPLOADCARE_SYSTEM_DIALOG = true;
  </script>
  <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

  <style>
    :root{ --bg:#f7fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px; }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 10px 30px rgba(2,6,23,.04);}
    header{padding:28px 0 10px;text-align:center}
    header h1{font-size:clamp(22px,4.6vw,34px);margin:0 0 8px}
    header p{margin:0 auto;color:var(--muted);max-width:640px;font-size:14px}
    .uploader{border:2px dashed #d1e3f6;border-radius:14px;background:#f0f7ff;padding:20px;text-align:center}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .btn.primary{background:linear-gradient(135deg,var(--accent),#60a5fa);color:#fff}
    .muted{color:var(--muted);font-size:14px}
    .preview img{max-width:100%;border-radius:12px;border:1px solid var(--line);box-shadow:0 12px 30px rgba(2,6,23,.06)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Подушка з твоїм дизайном</h1><h1>WOW-Подарунок</h1>
      <p>Завантаж фото → Переглянь макет → Оформи замовлення</p>
    </header>

    <section class="card">
      <h2 style="margin-top:4px">Завантажте ваше фото</h2>
      <p class="muted">Найкраще підходять зображення у повний зріст або від пояса</p>
      <div class="uploader" style="margin-top:10px">
        <button id="openUpload" class="btn primary">📸 Завантажити фото</button>
        <div id="status" class="muted" style="margin-top:10px"></div>
        <div id="preview" class="preview" style="margin-top:14px"></div>
      </div>
    </section>

    <footer style="margin:28px 0 16px;color:#64748b;font-size:13px;text-align:center">
      © <span id="year"></span> Подушка з фото
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // базовий URL для редіректу (GitHub Pages)
    const BASE = 'https://tsymbalkir-ux.github.io/pillow-preview/';

    function makeOrderId(){
      const d = new Date(), p = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.floor(1000+Math.random()*9000)}`;
    }

    // Беремо PNG зі сторони CDN (Uploadcare конвертує на льоту)
    async function fetchAsPngBlob(cdnUrl){
      const res = await fetch(`${cdnUrl}-/format/png/`, { cache: 'no-store' });
      if(!res.ok) throw new Error('Не вдалося отримати PNG');
      return await res.blob();
    }

    // Другий аплоад — STORED (з нашим ім’ям файлу)
    async function uploadBlobStored(blob, filename){
      const form = new FormData();
      form.append('UPLOADCARE_PUB_KEY', 'a531fc572a02653c4d18');
      form.append('UPLOADCARE_STORE', '1');
      form.append('file', blob, filename);
      const r = await fetch('https://upload.uploadcare.com/base/', { method:'POST', body: form });
      if(!r.ok) throw new Error('Помилка Uploadcare base/');
      const j = await r.json();
      const uuid = (typeof j.file === 'string') ? j.file : (j.file && j.file.uuid) || j.uuid;
      if(!uuid) throw new Error('Не отримали uuid другого аплоаду');
      return { uuid, cdnUrl: `https://ucarecdn.com/${uuid}/`, name: filename };
    }

    document.getElementById('openUpload').addEventListener('click', () => {
      const dialog = uploadcare.openDialog(null, null, { imagesOnly:true, systemDialog:true });
      dialog.done(file => {
        file.done(async info => {
          const status = document.getElementById('status');
          const preview = document.getElementById('preview');
          try {
            const orderId = makeOrderId();

            // 1) перший (unstored) аплоад — щоб взяти контент
            const srcCdn  = info.cdnUrl;
            if(!srcCdn) throw new Error('Uploadcare не повернув cdnUrl');

            // 2) конвертуємо в PNG та заливаємо як stored з ім’ям input-<orderId>.png
            const pngBlob = await fetchAsPngBlob(srcCdn);
            const newName = `input-${orderId}.png`;
            const stored  = await uploadBlobStored(pngBlob, newName); // {uuid, cdnUrl, name}

            // превʼю через PREVIEW + FORMAT/AUTO (швидкий показ)
            const thumb  = `${stored.cdnUrl}-/preview/900x900/-/format/auto/`;
            status.textContent = `✅ Завантажено як ${newName}`;
            preview.innerHTML = `<img src="${thumb}" alt="preview">`;

            // локальне збереження (для сумісності)
            localStorage.setItem('order_id', orderId);
            localStorage.setItem('input_url', stored.cdnUrl);
            localStorage.setItem('input_name', newName);
            localStorage.setItem('last_upload_url', stored.cdnUrl);
            localStorage.setItem('last_uuid', stored.uuid);

            // 3) редірект із UUID на сторінку попереднього перегляду
            const href = `${BASE}result.html?uuid=${encodeURIComponent(stored.uuid)}&img=${encodeURIComponent(stored.cdnUrl)}&order=${encodeURIComponent(orderId)}`;
            location.href = href;
          } catch(err){
            console.error('[upload] error:', err);
            status.textContent = '❌ Помилка: ' + err.message;
          }
        });
      });
    });
  </script>
</body>
</html>
