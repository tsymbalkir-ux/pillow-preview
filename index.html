<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Подушка з фото — Завантаж своє зображення</title>
  <meta name="description" content="Створи унікальний подарунок: подушка з твоїм фото. Завантаж — обробимо у Photoshop — отримаєш готовий макет." />
  <style>
    :root{--bg:#f7fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0ea5e9;--radius:18px}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
    header{text-align:center;margin:14px 0}
    header h1{margin:0 0 6px}
    .uploader{border:2px dashed var(--line);border-radius:14px;background:#fff;padding:18px;text-align:center}
    .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--accent)}
    #preview img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
    .muted{color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Подушка з фото</h1>
      <p class="muted">Завантажте зображення — ми підготуємо макет автоматично.</p>
    </header>

    <section class="card">
      <div class="uploader">
        <input id="file" type="file" accept="image/*" style="display:none" />
        <button id="pick" class="btn">📸 Обрати фото</button>
        <div id="status" class="muted" style="margin-top:10px">Готові, коли ви готові 🙂</div>
        <div id="preview" style="margin-top:14px"></div>
        <div style="margin-top:12px;display:none" id="goResultWrap">
          <a id="goResult" class="btn ghost" href="#">Відкрити сторінку результату →</a>
        </div>
      </div>
    </section>
  </div>

  <script>
    const WEB_APP_URL = 'YOUR_GAS_WEB_APP_EXEC_URL'; // <-- підстав свій

    const pickBtn  = document.getElementById('pick');
    const fileIn   = document.getElementById('file');
    const statusEl = document.getElementById('status');
    const preview  = document.getElementById('preview');
    const goWrap   = document.getElementById('goResultWrap');
    const goLink   = document.getElementById('goResult');

    pickBtn.addEventListener('click', ()=> fileIn.click());

    fileIn.addEventListener('change', async ()=> {
      const f = fileIn.files && fileIn.files[0];
      if (!f) return;

      // локальне превʼю
      const localUrl = URL.createObjectURL(f);
      preview.innerHTML = `<img src="${localUrl}" alt="Ваше фото">`;

      // читаємо як dataURL і шлемо у GAS
      statusEl.textContent = 'Завантажуємо у чергу…';
      const dataUrl = await new Promise((res, rej)=>{
        const r = new FileReader();
        r.onload = ()=> res(r.result);
        r.onerror = rej;
        r.readAsDataURL(f);
      });

      try{
        const resp = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: {'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ filename: f.name, dataUrl })
        });
        const j = await resp.json();
        if (!j.ok) throw new Error(j.error || 'Помилка завантаження');
        const jobId = j.job_id;

        statusEl.textContent = 'Фото у черзі. Йдемо на сторінку результату…';
        // збережемо jobId для відновлення
        localStorage.setItem('last_job_id', jobId);
        goLink.href = `result.html?job=${encodeURIComponent(jobId)}`;
        goWrap.style.display = 'block';
      } catch (err){
        console.error(err);
        statusEl.textContent = '❌ Не вдалося завантажити. Спробуйте ще раз.';
      }
    });
  </script>
</body>
</html>
