<script>
  const WEB_APP_URL = '<<ВАШ_GAS_URL_HERE>>';

  const pickBtn  = document.getElementById('pick');
  const fileIn   = document.getElementById('file');
  const statusEl = document.getElementById('status');
  const preview  = document.getElementById('preview');
  const goWrap   = document.getElementById('goResultWrap');
  const goLink   = document.getElementById('goResult');

  pickBtn.addEventListener('click', ()=> fileIn.click());

  async function fileToPngDataUrl(file){
    // створюємо bitmap / image
    const img = document.createElement('img');
    img.decoding = 'async';
    img.src = URL.createObjectURL(file);
    await new Promise((res, rej)=>{
      img.onload = ()=> res();
      img.onerror = rej;
    });

    // малюємо на canvas 1:1 (без компресії) → PNG
    const canvas = document.createElement('canvas');
    canvas.width  = img.naturalWidth  || img.width;
    canvas.height = img.naturalHeight || img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    // PNG гарантує сумісність із Photoshop
    const dataUrl = canvas.toDataURL('image/png'); // image/png, без втрат
    URL.revokeObjectURL(img.src);
    return dataUrl;
  }

  fileIn.addEventListener('change', async ()=> {
    const f = fileIn.files && fileIn.files[0];
    if (!f) return;

    // локальне превʼю
    const localUrl = URL.createObjectURL(f);
    preview.innerHTML = `<img src="${localUrl}" alt="Ваше фото">`;

    statusEl.textContent = 'Готуємо PNG і завантажуємо у чергу…';

    try{
      // ✅ завжди конвертуємо в PNG
      const dataUrlPng = await fileToPngDataUrl(f);

      const resp = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({
          // даємо підказку бекенду: це PNG
          filename: (f.name.replace(/\.[^.]+$/,'') || 'input') + '.png',
          mime: 'image/png',
          dataUrl: dataUrlPng
        })
      });
      const j = await resp.json();
      if (!j.ok) throw new Error(j.error || 'Помилка завантаження');
      const jobId = j.job_id;

      statusEl.textContent = 'Фото у черзі. Йдемо на сторінку результату…';
      localStorage.setItem('last_job_id', jobId);
      goLink.href = `result.html?job=${encodeURIComponent(jobId)}`;
      goWrap.style.display = 'block';
    } catch (err){
      console.error(err);
      statusEl.textContent = '❌ Не вдалося завантажити. Спробуйте ще раз.';
    }
  });
</script>
